<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request access — RT4Athletics</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=brand2">
  <link rel="stylesheet" href="assets/css/page.css?v=solis20">
  <script src="assets/js/analytics.js"></script>
</head>
<body>
  <main class="access-page">
    <a class="access-home" href="./">RT4Athletics</a>
    <form class="access-glass is-open" id="access-form" data-open>
      <p class="access-intent">Request a walkthrough</p>
      <div class="access-fields">
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
        <label>Power 4 program
          <select name="p4" required>
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </label>
        <label>What do you want
          <select name="intent">
            <option value="walkthrough">A walkthrough</option>
            <option value="sample">A sample</option>
          </select>
        </label>
        <p class="access-error" hidden>Could not save that. Try again.</p>
        <button type="submit" class="access-submit">Send</button>
      </div>
      <p class="access-done" hidden>Saved. We’ll be in touch.</p>
    </form>
  </main>
  <script src="assets/js/access.js?v=1"></script>
</body>
</html>
